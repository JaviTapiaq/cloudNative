server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Aplicacion de una sola pagina: las rutas de Angular (/tienda, /carrito, ...)
    # y la redireccion de Azure despues del login se resuelven en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
