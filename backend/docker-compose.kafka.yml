# Pedidos360 - Clúster Kafka: 3 Zookeeper + 3 brokers (+ kafka-init que crea los topicos).
#
#   cd backend
#   docker compose -f docker-compose.kafka.yml up -d
#
# Brokers desde el host:                          localhost:9091, localhost:9092, localhost:9093
# Brokers desde otros contenedores (pedidos360-net): kafka1:29092, kafka2:29092, kafka3:29092
# Kafka-UI: ver docker-compose.kafka-ui.yml
#
# La red "pedidos360-net" se comparte con docker-compose.yml: los microservicios
# (ms-pedidos, ms-analitica, ms-kafka-admin) alcanzan los brokers sin juntar ambos archivos.
# Memoria: con 8 GB de RAM conviene levantar solo lo necesario (ver CAMBIOS_KAFKA.md).

networks:
  default:
    name: pedidos360-net

# --- Configuracion comun a los 3 Zookeeper ---
x-zookeeper-common: &zookeeper-common
  image: confluentinc/cp-zookeeper:7.6.1
  environment: &zookeeper-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"
    KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
  healthcheck:
    test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
    interval: 10s
    timeout: 5s
    retries: 10
  mem_limit: 256m
  restart: unless-stopped

# --- Configuracion comun a los 3 brokers ---
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  depends_on: &kafka-depends
    zookeeper1:
      condition: service_healthy
    zookeeper2:
      condition: service_healthy
    zookeeper3:
      condition: service_healthy
  healthcheck:
    # Cada ejecucion lanza una JVM. Se le fija un heap pequeno: si heredara el del broker
    # (-Xms192m -Xmx320m) sumaria con el broker y superaria el limite de memoria del contenedor,
    # lo que genera una espiral de healthchecks lentos, reinicios y contenedores "unhealthy".
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx96m' kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 20s
    timeout: 30s
    retries: 10
    start_period: 60s
  mem_limit: 640m
  restart: unless-stopped

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Tolerancia a fallos: 3 replicas y minimo 2 sincronizadas (con acks=all se tolera la caida de 1 broker)
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Los topicos se crean de forma controlada (kafka-init / ms-kafka-admin), no por accidente
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_HEAP_OPTS: "-Xms192m -Xmx320m"
  KAFKA_LOG4J_ROOT_LOGLEVEL: WARN

services:
  # ------------------------------------------------------------------ Zookeeper (ensemble de 3)
  zookeeper1:
    <<: *zookeeper-common
    container_name: pedidos360-zookeeper1
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper1-data:/var/lib/zookeeper/data
      - zookeeper1-log:/var/lib/zookeeper/log

  zookeeper2:
    <<: *zookeeper-common
    container_name: pedidos360-zookeeper2
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2-data:/var/lib/zookeeper/data
      - zookeeper2-log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zookeeper-common
    container_name: pedidos360-zookeeper3
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3-data:/var/lib/zookeeper/data
      - zookeeper3-log:/var/lib/zookeeper/log

  # ------------------------------------------------------------------ Brokers Kafka
  # INTERNAL (29092): trafico entre brokers y contenedores | EXTERNAL (909x): acceso desde el host
  kafka1:
    <<: *kafka-common
    container_name: pedidos360-kafka1
    hostname: kafka1
    ports:
      - "9091:9091"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9091
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9091
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    container_name: pedidos360-kafka2
    hostname: kafka2
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:9092
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    container_name: pedidos360-kafka3
    hostname: kafka3
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:9093
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # ------------------------------------------------------------------ Topicos (un solo uso)
  # Crea los topicos de forma idempotente y termina. ms-kafka-admin tambien los garantiza al
  # arrancar (kafka.admin.bootstrap-topics), por lo que ambos caminos son equivalentes.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pedidos360-kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        B=kafka1:29092,kafka2:29092,kafka3:29092
        # Reporteria: historico de 7 dias
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic pedidos360.pedidos.eventos \
          --partitions 3 --replication-factor 3 \
          --config cleanup.policy=delete --config retention.ms=604800000 --config min.insync.replicas=2
        # Auditoria: bitacora de 30 dias (sin compactar: compactar borraria el historial)
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic pedidos360.auditoria.eventos \
          --partitions 3 --replication-factor 3 \
          --config cleanup.policy=delete --config retention.ms=2592000000 --config min.insync.replicas=2
        # Dead Letter Topics: mensajes que fallaron tras los reintentos
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic pedidos360.pedidos.eventos.DLT \
          --partitions 1 --replication-factor 3 --config retention.ms=2592000000
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic pedidos360.auditoria.eventos.DLT \
          --partitions 1 --replication-factor 3 --config retention.ms=2592000000
        kafka-topics --bootstrap-server $$B --list
    restart: "no"
    mem_limit: 256m

volumes:
  zookeeper1-data:
  zookeeper1-log:
  zookeeper2-data:
  zookeeper2-log:
  zookeeper3-data:
  zookeeper3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
