server.port=8080
spring.application.name=bff

# Microservicios URLs (en Docker se sobrescriben con variables de entorno)
bff.services.clientes-url=${CLIENTES_URL:http://localhost:8081/api/clientes}
bff.services.productos-url=${PRODUCTOS_URL:http://localhost:8082/api/productos}
bff.services.pedidos-url=${PEDIDOS_URL:http://localhost:8083/api/pedidos}
bff.services.mensajeria-url=${MENSAJERIA_URL:http://localhost:8084/api/mensajeria}
bff.services.admin-url=${ADMIN_URL:http://localhost:8084/api/admin}

# Microsoft Entra ID (Azure AD)
spring.cloud.azure.active-directory.enable=true
spring.cloud.azure.active-directory.client-id=2f281162-babf-4536-88c8-942f20273edb
spring.cloud.azure.active-directory.app-id-uri=api://2f281162-babf-4536-88c8-942f20273edb

# JWT Validation
bff.idaas.issuer=https://sts.windows.net/2065748d-ab65-48bd-8110-f6e96d8fd02e/
#https://login.microsoftonline.com/2065748d-ab65-48bd-8110-f6e96d8fd02e/v2.0
bff.idaas.audience=api://2f281162-babf-4536-88c8-942f20273edb
bff.idaas.jwks-uri=https://login.microsoftonline.com/2065748d-ab65-48bd-8110-f6e96d8fd02e/discovery/v2.0/keys
bff.idaas.valid-roles=Admin,User
# true: JwtAuthFilter exige un rol de valid-roles, y el rol Admin para /api/admin y /api/mensajeria.
# Requiere asignar los roles de aplicacion al usuario en Azure.
bff.idaas.enforce-roles=${BFF_ENFORCE_ROLES:false}
bff.idaas.admin-role=Admin

# Logging
logging.level.com.pedidos360.bff=DEBUG
