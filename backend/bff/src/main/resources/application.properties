server.port=8080
spring.application.name=bff

# Microservicios URLs
bff.services.clientes-url=http://localhost:8081/api/clientes
bff.services.productos-url=http://localhost:8082/api/productos
bff.services.pedidos-url=http://localhost:8083/api/pedidos

# IDaaS (Azure AD) - PLACEHOLDERS: rellenar con datos del tenant
# Issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
bff.idaas.issuer=
# Audience: el clientId de la API expuesta en Azure AD
bff.idaas.audience=
# JWKS URI: https://login.microsoftonline.com/<tenant-id>/discovery/v2.0/keys
bff.idaas.jwks-uri=
# Roles validos definidos en el tenant
bff.idaas.valid-roles=Admin,User

# Logging
logging.level.com.pedidos360.bff=DEBUG
