# Formacion del clúster RabbitMQ (se monta en /etc/rabbitmq/conf.d/ de ambos nodos).
# Los nodos listados se descubren entre si al arrancar: el que encuentra a otro vivo se une
# a su clúster; si es el primero, inicia uno nuevo. Requiere la misma cookie de Erlang
# (RABBITMQ_ERLANG_COOKIE en docker-compose.yml) y nombres de host resolubles.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
